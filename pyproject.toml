[project]
name = "deploy-agent"
version = "0.1.0"
description = "Local-first CLI that helps developers deploy software projects."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
deploy-agent = "deploy_agent.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
